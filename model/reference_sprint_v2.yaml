# 極限前傾スプリント用参照歩容（Sprint v2）。
# 前傾角を p_off=-0.190（約11度）まで深め、T=0.420s・大ストライド p_amp=-0.240 で更なる最高速を狙う。
# 膝曲げ k_off=0.610 で重心を低く構え、足首 a_off=-0.345 でフラットな力強い蹴り出しを実現。

T: 0.420
r_add: 0.125
r_amp: 0.130       # 横揺れを抑えて直進性を安定化
phr: -1.714
p_off: -0.190      # 深い前傾姿勢（前方重力加速の最大化）
p_amp: -0.240      # 大ストライド
k_off: 0.610       # 低重心クラウチング姿勢
k_amp: 0.600       # 強力な伸展キック
phk: 1.622
a_off: -0.345      # 前傾連動の足首オフセット
a_amp: -0.240      # 足首による後方押し出し
pha: 2.470
