# 前傾姿勢（Forward Lean）＋ 大ストライドの高速走行用参照歩容。
# 股関節ピッチ p_off を -0.160 に倒し、前傾重心による前方への重力加速と大ストライドを活用。
# 周期 T = 0.440s に設定し、サーボ速度上限 (5.0 rad/s) の制約下で最大の歩幅を確保。

T: 0.440
r_add: 0.100       # 左右揺動オフセット
r_amp: 0.180       # 左右揺動振幅（前傾走行時のロールブレを抑制）
phr: -0.216
p_off: -0.160      # 前傾姿勢オフセット（重心を前方へ倒す）
p_amp: -0.160      # 股関節ピッチのストライド拡大
k_off: 0.500
k_amp: 0.550       # 膝の押し出し
phk: -3.142
a_off: -0.280      # 足首前傾連動
a_amp: -0.280      # 足首の蹴り出し
pha: -2.732
