# ロボットの物理パラメータ — このファイルが唯一の正
#
# HumanoidTNK_FINAL（8サーボ / 各脚: 股ロール + 股ピッチ + 膝 + 足首ピッチ）
# 質量・慣性: model/meshes/*.stl から体積・重心・慣性を実測し
#   実効PLA密度 1178 kg/m^3 (中実1240.0 x infill 0.95) を乗算、
#   MG996R x8 (各55g) と 電装 150g(base, 仮) を合成。詳細は URDF の <inertial>。
# 単位: 長さ[m] / 質量[kg] / 角度[rad] / 慣性[kg*m^2]

meta:
  name: humanoid-tnk-8dof
  version: 0.3.0
  status: draft   # 電装重量とサーボ本トルクを実測したら fixed へ

timing:
  control_hz: 50
  firmware_hz: 1000
  comm_delay_s: null

robot:
  total_mass: 0.951
  height: null          # TODO: 立位姿勢での全高（起動時に自動計測される）
  num_joints: 8

actuator:
  model: MG996R
  count: 8
  mass_each: 0.055
  stall_torque_nm: 1.0
  no_load_speed_rps: 6.0

links:
  base_link  {mass: 0.3359}   # 骨盤 + 股ロールサーボ2 + 電装
  LU1_1      {mass: 0.0977}   # 左 股ロールリンク + 股ピッチサーボ
  LU2_1      {mass: 0.0986}   # 左 腿 + 膝サーボ
  LU3_1      {mass: 0.0986}   # 左 脛 + 足首サーボ
  LU4_1      {mass: 0.0128}   # 左 足（サーボ無し）
  RU1_1      {mass: 0.0977}   # 右 股ロールリンク + 股ピッチサーボ
  RU2_1      {mass: 0.0986}   # 右 腿 + 膝サーボ
  RU3_1      {mass: 0.0986}   # 右 脛 + 足首サーボ
  RU4_1      {mass: 0.0128}   # 右 足（サーボ無し）

# 関節（並び順が RobotState.joint_positions と一致 = PyBullet tree順: 左脚 → 右脚）
# torque_max = MG996R ストールトルク。lower/upper は URDF 由来（機構的可動域は要確認）
joints:
  - {id: 0, name: L_hip_roll, axis: y, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
  - {id: 1, name: L_hip_pitch, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
  - {id: 2, name: L_knee, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
  - {id: 3, name: L_ankle_pitch, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
  - {id: 4, name: R_hip_roll, axis: y, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
  - {id: 5, name: R_hip_pitch, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
  - {id: 6, name: R_knee, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
  - {id: 7, name: R_ankle_pitch, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0}
