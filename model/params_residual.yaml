# ロボットの物理パラメータ — このファイルが唯一の正
#
# HumanoidTNK_FINAL（8サーボ / 各脚: 股ロール + 股ピッチ + 膝 + 足首ピッチ）
# 質量・慣性: model/meshes/*.stl から体積・重心・慣性を実測し
#   実効PLA密度 1178 kg/m^3 (中実1240.0 x infill 0.95) を乗算、
#   MG996R x8 (各55g) と 電装 150g(base, 仮) を合成。詳細は URDF の <inertial>。
# 単位: 長さ[m] / 質量[kg] / 角度[rad] / 慣性[kg*m^2]

meta:
  name: humanoid-tnk-8dof
  version: 0.3.0
  status: draft   # 電装重量とサーボ本トルクを実測したら fixed へ

timing:
  control_hz: 50
  gait_period: 0.6    # 歩行周期 [s]（左右1歩ずつ）。学習と実機で一致させること
  firmware_hz: 1000
  comm_delay_s: null

robot:
  total_mass: 0.951
  height: null          # TODO: 立位姿勢での全高（起動時に自動計測される）
  num_joints: 8

actuator:
  model: MG996R
  count: 8
  mass_each: 0.055
  stall_torque_nm: 1.0
  no_load_speed_rps: 6.0

links:
  base_link  {mass: 0.3359}   # 骨盤 + 股ロールサーボ2 + 電装
  LU1_1      {mass: 0.0977}   # 左 股ロールリンク + 股ピッチサーボ
  LU2_1      {mass: 0.0986}   # 左 腿 + 膝サーボ
  LU3_1      {mass: 0.0986}   # 左 脛 + 足首サーボ
  LU4_1      {mass: 0.0128}   # 左 足（サーボ無し）
  RU1_1      {mass: 0.0977}   # 右 股ロールリンク + 股ピッチサーボ
  RU2_1      {mass: 0.0986}   # 右 腿 + 膝サーボ
  RU3_1      {mass: 0.0986}   # 右 脛 + 足首サーボ
  RU4_1      {mass: 0.0128}   # 右 足（サーボ無し）

# 関節（並び順が RobotState.joint_positions と一致 = PyBullet tree順: 左脚 → 右脚）
# torque_max = MG996R ストールトルク。lower/upper は URDF 由来（機構的可動域は要確認）
# action_scale = 学習の [-1,1] 指令を関節角[rad]へ変換する係数（目標角 = action * action_scale、
#   可動域にクリップ）。膝は歩行で深く曲げるため広く、股ロール/足首は安定性優先で狭め。
#   MG996R の実用可動角 ~120°(±1.05rad) を上限の目安にしている。実機ROM測定後に要見直し。
joints:
  - {id: 0, name: L_hip_roll,    axis: y, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 0.35}
  - {id: 1, name: L_hip_pitch,   axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 0.75}
  - {id: 2, name: L_knee,        axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 1.0}
  - {id: 3, name: L_ankle_pitch, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 0.5}
  - {id: 4, name: R_hip_roll,    axis: y, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 0.35}
  - {id: 5, name: R_hip_pitch,   axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 0.75}
  - {id: 6, name: R_knee,        axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 1.0}
  - {id: 7, name: R_ankle_pitch, axis: x, limit_lower: -1.570796, limit_upper: 1.570796, torque_max: 1.0, action_scale: 0.5}

# --- 参照歩容 + 残差制御（params.yaml との差分はこのブロックだけ）---
# 関節目標角 = reference_gait(位相) + action * residual_scale。gait_period は参照の T で上書きされる。
reference_gait:
  file: reference_gait.yaml
  residual_scale: [0.15, 0.2, 0.25, 0.2, 0.15, 0.2, 0.25, 0.2]   # L roll,pitch,knee,ankle, R ... [rad]
