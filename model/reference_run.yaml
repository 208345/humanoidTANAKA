# 走行（ランニング）用の参照歩容。
# 歩行用（reference_gait.yaml）の T=0.523s からピッチを高速化し T=0.40s へ短縮。
# 左右の揺動 (r_amp) を抑えつつ、ピッチ方向の蹴り出しと脚の回転を速める。
# MG996R の最高速度 (5.0 rad/s 制限) の範囲内で最大のステップ頻度を確保する設計。

T: 0.400
r_add: 0.100       # 左右揺動のオフセット（走行時は直進性を重視してやや小さめ）
r_amp: 0.220       # 左右揺動の振幅（左右のブレを抑える）
phr: -0.216
p_off: -0.116
p_amp: -0.140      # 股関節ピッチの振幅（歩幅を少し確保）
k_off: 0.500
k_amp: 0.520       # 膝の屈伸（高回転追従のため歩行よりわずかに控えめにしてサーボ飽和を防ぐ）
phk: -3.142
a_off: -0.297
a_amp: -0.280      # 足首の蹴り出し
pha: -2.732
