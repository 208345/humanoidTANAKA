# 高速走行（スプリント）用の参照歩容。
# 周期 T を 0.35s まで短縮（約 5.7 歩/秒の高速ケイデンス）。
# 左右の横揺れ (r_amp) を極限まで抑え、前進ピッチ方向の蹴り出しと脚の素早い振り出しを両立。

T: 0.350
r_add: 0.080       # 左右揺動オフセット（直進性最優先）
r_amp: 0.160       # 左右揺動振幅（高速走行時のロールブレを抑制）
phr: -0.216
p_off: -0.116
p_amp: -0.160      # 股関節ピッチのストライドを拡大
k_off: 0.480
k_amp: 0.480       # 高回転追従のため膝の曲げ角を最適化
phk: -3.142
a_off: -0.297
a_amp: -0.280      # 足首の蹴り出し
pha: -2.732
