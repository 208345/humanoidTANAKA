# 最速スプリント（Fast Sprint）用カリキュラム
# ベース速度 0.195 m/s の参照歩容に乗せ、残差RLで 0.25 〜 0.32 m/s へ一気に加速させる。

phases:
  - name: "Phase 1: 高速スプリント適応 (目標 0.25 m/s)"
    reward_type: walking
    reward_params:
      target_velocity: 0.25
      velocity_weight: 15.0
      velocity_sharpness: 35.0
      velocity_gait_gate: false
      survival_reward: 6.0
      fall_penalty: -200.0
      fall_threshold: 1.0
      min_height: 0.09
      terminate_on_body_contact: true
      orientation_weight: 8.0
      ang_vel_weight: 0.05
      effort_weight: 0.35
      smoothness_weight: 0.2
      lateral_weight: 8.0
      heading_weight: 15.0
      yaw_limit: 0.6
      gait_weight: 0.0
      swing_ratio: 1.0
      lag_lift_bonus: 0.0
      lift_balance_weight: 16.0
      alternation_weight: 0.0
      double_support_penalty: 0.0
      contact_change_penalty: 0.2
      swing_weight: 80.0
      swing_clear_cap: 0.025
      swing_forward_weight: 10.0
      slip_weight: 6.0              # 強い蹴り出し時の滑りを過剰に罰しない
      foot_rest_height: 0.014
      lift_vel_weight: 0.0
      skim_penalty: 0.0
      skim_target: 0.01
      height_weight: 25.0
      target_height: 0.12
    graduation:
      metric: mean_reward
      threshold: 8000.0
      window: 100
      min_steps: 150000

  - name: "Phase 2: 最高速スプリント (目標 0.32 m/s)"
    reward_type: walking
    reward_params:
      target_velocity: 0.32
      velocity_weight: 18.0
      velocity_sharpness: 25.0
      velocity_gait_gate: false
      survival_reward: 6.0
      fall_penalty: -200.0
      fall_threshold: 1.0
      min_height: 0.09
      terminate_on_body_contact: true
      orientation_weight: 8.0
      ang_vel_weight: 0.05
      effort_weight: 0.3
      smoothness_weight: 0.15
      lateral_weight: 8.0
      heading_weight: 15.0
      yaw_limit: 0.6
      gait_weight: 0.0
      swing_ratio: 1.0
      lag_lift_bonus: 0.0
      lift_balance_weight: 14.0
      alternation_weight: 0.0
      double_support_penalty: 0.0
      contact_change_penalty: 0.15
      swing_weight: 80.0
      swing_clear_cap: 0.028
      swing_forward_weight: 12.0
      slip_weight: 5.0
      foot_rest_height: 0.014
      lift_vel_weight: 0.0
      skim_penalty: 0.0
      skim_target: 0.01
      height_weight: 20.0
      target_height: 0.12
    graduation:
      metric: mean_reward
      threshold: 1.0e9
      window: 200
      min_steps: 1000000000
