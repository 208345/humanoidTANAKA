# 高速走行（スプリント）用カリキュラム
# 目標速度 0.30 m/s から 0.45 m/s への加速を促す設定。

phases:
  - name: "Phase 1: スプリント基礎 (目標 0.30 m/s)"
    reward_type: walking
    reward_params:
      target_velocity: 0.30
      velocity_weight: 15.0
      velocity_sharpness: 80.0
      velocity_gait_gate: false
      survival_reward: 6.0
      fall_penalty: -200.0
      fall_threshold: 1.0
      min_height: 0.09
      terminate_on_body_contact: true
      orientation_weight: 8.0
      ang_vel_weight: 0.05
      effort_weight: 0.35
      smoothness_weight: 0.2
      lateral_weight: 8.0
      heading_weight: 15.0
      yaw_limit: 0.6
      gait_weight: 0.0
      swing_ratio: 1.0
      lag_lift_bonus: 0.0
      lift_balance_weight: 18.0
      alternation_weight: 0.0
      double_support_penalty: 0.0
      contact_change_penalty: 0.2
      swing_weight: 70.0
      swing_clear_cap: 0.025
      swing_forward_weight: 10.0
      slip_weight: 18.0
      foot_rest_height: 0.014
      lift_vel_weight: 0.0
      skim_penalty: 0.0
      skim_target: 0.01
      height_weight: 25.0
      target_height: 0.12
    graduation:
      metric: mean_reward
      threshold: 8000.0
      window: 100
      min_steps: 150000

  - name: "Phase 2: スプリント加速 (目標 0.45 m/s)"
    reward_type: walking
    reward_params:
      target_velocity: 0.45
      velocity_weight: 20.0
      velocity_sharpness: 60.0
      velocity_gait_gate: false
      survival_reward: 6.0
      fall_penalty: -200.0
      fall_threshold: 1.0
      min_height: 0.09
      terminate_on_body_contact: true
      orientation_weight: 8.0
      ang_vel_weight: 0.05
      effort_weight: 0.3
      smoothness_weight: 0.15
      lateral_weight: 8.0
      heading_weight: 15.0
      yaw_limit: 0.6
      gait_weight: 0.0
      swing_ratio: 1.0
      lag_lift_bonus: 0.0
      lift_balance_weight: 12.0
      alternation_weight: 0.0
      double_support_penalty: 0.0
      contact_change_penalty: 0.15
      swing_weight: 70.0
      swing_clear_cap: 0.030
      swing_forward_weight: 15.0
      slip_weight: 12.0
      foot_rest_height: 0.014
      lift_vel_weight: 0.0
      skim_penalty: 0.0
      skim_target: 0.01
      height_weight: 20.0
      target_height: 0.12
    graduation:
      metric: mean_reward
      threshold: 1.0e9
      window: 200
      min_steps: 1000000000
